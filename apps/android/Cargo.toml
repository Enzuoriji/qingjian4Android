[package]
name = "qingjian-android"
description = "Android 输入法：JNI 桥接，把平台无关的 Core 接到 InputMethodService"
version = "0.1.0-dev"
edition.workspace = true
license.workspace = true
repository.workspace = true

# cdylib 是产物 libqingjian_android.so（Gradle 按这个名字打进 APK）；rlib 给端到端测试用。
[lib]
name = "qingjian_android"
crate-type = ["cdylib", "rlib"]

[dependencies]
qingjian-core.workspace = true
qingjian-dictionary.workspace = true
qingjian-learning.workspace = true
qingjian-lm.workspace = true
qingjian-platform.workspace = true
qingjian-predict.workspace = true
qingjian-render.workspace = true
qingjian-translate.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

jni = "0.21"

[lints]
workspace = true

# 只有安卓用得上：日志写 logcat、订阅器只在设备上装。宿主机跑测试时不编这两个，
# 免得为了 `cargo test` 白编一遍 tracing-subscriber。
[target.'cfg(target_os = "android")'.dependencies]
android_log-sys = "0.3.2"
tracing-subscriber.workspace = true
