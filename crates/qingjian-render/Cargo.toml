[package]
name = "qingjian-render"
description = "自绘渲染器：把候选窗一帧画成位图，各平台只负责贴图"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
tiny-skia.workspace = true
cosmic-text.workspace = true
thiserror.workspace = true
tracing.workspace = true
ttf-parser = "0.25.1"

[target.'cfg(windows)'.dependencies]
# 字体登记走 DirectWrite（按字族名找文件、列字族）
windows = { version = "0.62.2", features = ["Win32_Graphics_DirectWrite"] }

[target.'cfg(target_os = "android")'.dependencies]
# fonts/android.rs 要实现 cosmic-text 的 Fallback（安卓平台的默认表是空的），
# 那份 trait 按脚本选字族，签名里带 unicode_script::Script
unicode-script.workspace = true

[dev-dependencies]
clap.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
